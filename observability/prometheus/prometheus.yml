global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # The benchmark pushes results here; honor_labels keeps the test/category/commit
  # labels from the pushed metrics instead of overwriting them.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # Watchtower node exporter (mainnet node).
  - job_name: monero_node
    static_configs:
      - targets: ["monero-node:9000"]
        labels: { network: mainnet, profile: hdd-pruned }

  # FCMP++ & Carrot beta stressnet v3 (testnet), SSD profile.
  - job_name: stressnet_ssd
    static_configs:
      - targets: ["stressnet-ssd:9000"]
        labels: { network: stressnet, profile: ssd-full }
