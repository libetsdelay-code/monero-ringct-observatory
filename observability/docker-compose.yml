# Prometheus + Pushgateway + Grafana for the RingCT Performance Observatory.
# Benchmark runs push results to the Pushgateway; Prometheus scrapes it;
# Grafana shows the dashboard. Portable: same stack moves to server unchanged.
name: ringct-observatory

services:
  pushgateway:
    image: prom/pushgateway:v1.9.0
    restart: unless-stopped
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v2.53.2
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    # Scrape targets are referenced by name in prometheus.yml; the real
    # addresses live in observability/.env (git-ignored, see .env.example).
    extra_hosts:
      - "monero-node:${MONERO_NODE_IP:?set MONERO_NODE_IP in observability/.env}"
      - "stressnet-ssd:${STRESSNET_SSD_IP:?set STRESSNET_SSD_IP in observability/.env}"
      - "stressnet-hdd:${STRESSNET_HDD_IP:?set STRESSNET_HDD_IP in observability/.env}"
    ports:
      - "9090:9090"
    depends_on:
      - pushgateway

  grafana:
    image: grafana/grafana:11.1.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prom_data:
  grafana_data:
